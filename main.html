<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomberman Online - Multiplayer Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #menu {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #00ffff;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #00ffff; }
            50% { text-shadow: 0 0 40px #00ffff, 0 0 60px #00ffff; }
        }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        input, select {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 300px;
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 15px #00ffff;
        }

        .skin-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .skin-option {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .skin-option:hover {
            transform: scale(1.1);
            border-color: #00ffff;
        }

        .skin-option.selected {
            border-color: #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffff 0%, #00aaff 100%);
            color: #000;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ffff;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff00ff 0%, #aa00ff 100%);
            color: #fff;
        }

        .btn-secondary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff00ff;
        }

        #lobby {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 20px;
            min-width: 500px;
        }

        .player-list {
            margin: 20px 0;
            min-height: 150px;
        }

        .player-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-avatar {
            font-size: 32px;
        }

        #gameContainer {
            position: relative;
        }

        #gameCanvas {
            border: 4px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            background: #1a1a1a;
        }

        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ffff;
        }

        .player-hud {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .player-hud .avatar {
            font-size: 24px;
        }

        .player-stats {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
        }

        .stat-bar {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        #gameOver {
            text-align: center;
        }

        .leaderboard {
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            min-width: 500px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 18px;
        }

        .leaderboard-item.winner {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 20px #ffd700;
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 40px #00ffff;
            animation: countdownPulse 1s ease-in-out;
            pointer-events: none;
        }

        @keyframes countdownPulse {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spectator-mode {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #ff0000;
        }

        .powerup-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
        }

        .powerup-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <!-- MENU SCREEN -->
    <div id="menu" class="screen active">
        <h1>💣 BOMBERMAN ONLINE 💣</h1>
        
        <div class="input-group">
            <label>Tên người chơi:</label>
            <input type="text" id="playerName" placeholder="Nhập tên của bạn" maxlength="15" value="Player">
        </div>

        <div class="input-group">
            <label>Chọn nhân vật:</label>
            <div class="skin-selector">
                <div class="skin-option selected" data-skin="0">🔴</div>
                <div class="skin-option" data-skin="1">🔵</div>
                <div class="skin-option" data-skin="2">🟢</div>
                <div class="skin-option" data-skin="3">🟡</div>
                <div class="skin-option" data-skin="4">🟣</div>
                <div class="skin-option" data-skin="5">🟠</div>
            </div>
        </div>

        <div class="input-group">
            <label>Kích thước map:</label>
            <select id="mapSize">
                <option value="6">Nhỏ (6x6)</option>
                <option value="8">Vừa (8x8)</option>
                <option value="16" selected>Lớn (16x16)</option>
                <option value="32">Siêu lớn (32x32)</option>
            </select>
        </div>

        <div>
            <button class="btn-primary" onclick="joinGame()">CHƠI NGAY!</button>
        </div>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby" class="screen">
        <h2>🎮 Phòng Chờ 🎮</h2>
        <p style="margin: 10px 0; font-size: 16px;">Đang chờ người chơi khác... (Tối đa 4 người)</p>
        <div class="player-list" id="playerList"></div>
        <div>
            <button class="btn-primary" id="startBtn" onclick="startGame()" disabled>Bắt Đầu (Cần 2-4 người)</button>
            <button class="btn-secondary" onclick="backToMenu()">Quay Lại</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameContainer" class="screen">
        <div id="gameUI"></div>
        <canvas id="gameCanvas"></canvas>
        <div id="powerupIndicator" class="powerup-indicator"></div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameOver" class="screen">
        <h1>🏆 KẾT THÚC GAME 🏆</h1>
        <div class="leaderboard" id="leaderboard"></div>
        <div>
            <button class="btn-primary" onclick="playAgain()">Chơi Lại</button>
            <button class="btn-secondary" onclick="backToMenu()">Menu Chính</button>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const CONFIG = {
            TILE_SIZE: 32,
            BASE_MAP_SIZE: 32,
            FPS: 60,
            BOMB_TIMER: 3000,
            POWERUP_CHANCE: 0.18,
            MAX_PLAYERS: 4,
            GAME_TIME: 300000, // 5 minutes
            PLAYER_COLORS: ['#ff3333', '#3333ff', '#33ff33', '#ffff33', '#ff33ff', '#ff9933'],
            PLAYER_EMOJIS: ['🔴', '🔵', '🟢', '🟡', '🟣', '🟠']
        };

        // ===== GLOBAL STATE =====
        let currentScreen = 'menu';
        let gameInstance = null;
        let playerConfig = {
            name: 'Player',
            skin: 0,
            mapSize: 16
        };
        
        // Shared lobby (simulated - in real app this would be on server)
        const SHARED_ROOM_KEY = 'bomberman_shared_room';
        let myPlayerId = null;
        let lobbyCheckInterval = null;

        // ===== PERLIN NOISE FOR MAP GENERATION =====
        class PerlinNoise {
            constructor(seed = Math.random()) {
                this.seed = seed;
                this.p = this.shuffle(Array.from({length: 256}, (_, i) => i));
                this.p = [...this.p, ...this.p];
            }

            shuffle(array) {
                let m = array.length, t, i;
                while (m) {
                    i = Math.floor(this.random() * m--);
                    t = array[m];
                    array[m] = array[i];
                    array[i] = t;
                }
                return array;
            }

            random() {
                const x = Math.sin(this.seed++) * 10000;
                return x - Math.floor(x);
            }

            fade(t) {
                return t * t * t * (t * (t * 6 - 15) + 10);
            }

            lerp(t, a, b) {
                return a + t * (b - a);
            }

            grad(hash, x, y) {
                const h = hash & 3;
                const u = h < 2 ? x : y;
                const v = h < 2 ? y : x;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }

            noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                
                x -= Math.floor(x);
                y -= Math.floor(y);
                
                const u = this.fade(x);
                const v = this.fade(y);
                
                const a = this.p[X] + Y;
                const b = this.p[X + 1] + Y;
                
                return this.lerp(v,
                    this.lerp(u, this.grad(this.p[a], x, y), this.grad(this.p[b], x - 1, y)),
                    this.lerp(u, this.grad(this.p[a + 1], x, y - 1), this.grad(this.p[b + 1], x - 1, y - 1))
                );
            }
        }

        // ===== MAP GENERATOR =====
        class MapGenerator {
            constructor(seed) {
                this.perlin = new PerlinNoise(seed);
                this.baseSize = CONFIG.BASE_MAP_SIZE;
            }

            generateMap(targetSize) {
                // Always generate 32x32 base map
                const baseMap = this.createBaseMap();
                
                // Crop to target size
                if (targetSize < this.baseSize) {
                    return this.cropMap(baseMap, targetSize);
                }
                
                return baseMap;
            }

            createBaseMap() {
                const size = this.baseSize;
                const map = Array(size).fill(null).map(() => Array(size).fill(0));
                
                // 1. Border walls (hard walls)
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        if (x === 0 || x === size - 1 || y === 0 || y === size - 1) {
                            map[y][x] = 1; // Hard wall
                        }
                    }
                }
                
                // 2. Create spawn zones (3x3 corners)
                const spawns = [
                    {x: 1, y: 1}, // Top-left
                    {x: size - 4, y: 1}, // Top-right
                    {x: 1, y: size - 4}, // Bottom-left
                    {x: size - 4, y: size - 4} // Bottom-right
                ];
                
                spawns.forEach(spawn => {
                    for (let dy = 0; dy < 3; dy++) {
                        for (let dx = 0; dx < 3; dx++) {
                            map[spawn.y + dy][spawn.x + dx] = 0; // Keep clear
                        }
                    }
                });
                
                // 3. Pattern hard walls (maze structure)
                for (let y = 2; y < size - 2; y += 2) {
                    for (let x = 2; x < size - 2; x += 2) {
                        // Skip spawn zones
                        const inSpawn = spawns.some(s => 
                            x >= s.x && x < s.x + 3 && y >= s.y && y < s.y + 3
                        );
                        if (!inSpawn) {
                            map[y][x] = 1; // Hard wall pattern
                        }
                    }
                }
                
                // 4. Add soft walls with Perlin noise
                for (let y = 1; y < size - 1; y++) {
                    for (let x = 1; x < size - 1; x++) {
                        if (map[y][x] !== 0) continue;
                        
                        const inSpawn = spawns.some(s => 
                            x >= s.x && x < s.x + 3 && y >= s.y && y < s.y + 3
                        );
                        
                        if (!inSpawn) {
                            const noise = this.perlin.noise(x * 0.2, y * 0.2);
                            const rand = Math.random();
                            
                            if (noise > 0.1 && rand < 0.3) {
                                map[y][x] = 2; // Soft wall
                            } else if (noise < -0.3 && rand < 0.1) {
                                map[y][x] = 3; // Tree
                            } else if (rand < 0.05) {
                                map[y][x] = 4; // Bush
                            }
                        }
                    }
                }
                
                // 5. Ensure connectivity
                this.ensureConnectivity(map, spawns);
                
                return map;
            }

            ensureConnectivity(map, spawns) {
                // Simple connectivity check using flood fill
                const size = map.length;
                const visited = Array(size).fill(null).map(() => Array(size).fill(false));
                
                const floodFill = (x, y) => {
                    if (x < 0 || x >= size || y < 0 || y >= size) return;
                    if (visited[y][x] || map[y][x] === 1) return;
                    
                    visited[y][x] = true;
                    floodFill(x + 1, y);
                    floodFill(x - 1, y);
                    floodFill(x, y + 1);
                    floodFill(x, y - 1);
                };
                
                // Start flood fill from first spawn
                floodFill(spawns[0].x + 1, spawns[0].y + 1);
                
                // Check if all spawns are reachable
                for (let spawn of spawns) {
                    if (!visited[spawn.y + 1][spawn.x + 1]) {
                        // Create path to unreachable spawn
                        this.createPath(map, spawns[0], spawn);
                    }
                }
            }

            createPath(map, from, to) {
                let x = from.x + 1;
                let y = from.y + 1;
                const tx = to.x + 1;
                const ty = to.y + 1;
                
                while (x !== tx || y !== ty) {
                    if (map[y][x] === 2) map[y][x] = 0; // Remove soft walls
                    
                    if (x < tx) x++;
                    else if (x > tx) x--;
                    else if (y < ty) y++;
                    else if (y > ty) y--;
                }
            }

            cropMap(baseMap, targetSize) {
                const offset = Math.floor((this.baseSize - targetSize) / 2);
                const cropped = [];
                
                for (let y = offset; y < offset + targetSize; y++) {
                    cropped.push(baseMap[y].slice(offset, offset + targetSize));
                }
                
                return cropped;
            }

            getSpawnPositions(mapSize) {
                // Return spawn positions based on map size
                const positions = [
                    {x: 1, y: 1},
                    {x: mapSize - 2, y: 1},
                    {x: 1, y: mapSize - 2},
                    {x: mapSize - 2, y: mapSize - 2}
                ];
                return positions;
            }
        }

        // ===== POWER-UP TYPES =====
        const POWERUP_TYPES = {
            FIRE_UP: { emoji: '🔥', name: 'Fire Up', effect: 'fireRange' },
            BOMB_UP: { emoji: '💣', name: 'Bomb Up', effect: 'bombCount' },
            SPEED_UP: { emoji: '⚡', name: 'Speed Up', effect: 'speed' },
            PIERCE_BOMB: { emoji: '☠️', name: 'Pierce Bomb', effect: 'pierce' },
            POWER_BOMB: { emoji: '💥', name: 'Power Bomb', effect: 'powerBomb' },
            REMOTE_BOMB: { emoji: '🎯', name: 'Remote Bomb', effect: 'remote' },
            KICK_BOMB: { emoji: '🦶', name: 'Kick Bomb', effect: 'kick' },
            SHIELD: { emoji: '🛡️', name: 'Shield', effect: 'shield' },
            EXTRA_LIFE: { emoji: '❤️', name: 'Extra Life', effect: 'life' },
            GHOST: { emoji: '👻', name: 'Ghost', effect: 'ghost' },
            STAR: { emoji: '⭐', name: 'Star', effect: 'invincible' },
            MYSTERY: { emoji: '🎲', name: 'Mystery Box', effect: 'mystery' },
            WAVE_BOMB: { emoji: '🌊', name: 'Wave Bomb', effect: 'wave' },
            FAST_BOMB: { emoji: '⏱️', name: 'Fast Bomb', effect: 'fastBomb' },
            SKULL: { emoji: '💀', name: 'Skull', effect: 'skull' }
        };

        // ===== PLAYER CLASS =====
        class Player {
            constructor(id, name, skin, x, y) {
                this.id = id;
                this.name = name;
                this.skin = skin;
                this.x = x;
                this.y = y;
                this.gridX = x;
                this.gridY = y;
                this.speed = 2.5;
                this.bombCount = 1;
                this.fireRange = 2;
                this.lives = 1;
                this.score = 0;
                this.kills = 0;
                this.deaths = 0;
                this.activeBombs = 0;
                this.powerups = [];
                this.alive = true;
                this.invincible = false;
                this.invincibleTimer = 0;
                this.ghostMode = false;
                this.ghostTimer = 0;
                this.shieldActive = false;
                this.cursed = false;
                this.cursedTimer = 0;
            }

            update(deltaTime, map) {
                // Update grid position
                this.gridX = Math.floor(this.x / CONFIG.TILE_SIZE);
                this.gridY = Math.floor(this.y / CONFIG.TILE_SIZE);
                
                // Update timers
                if (this.invincible) {
                    this.invincibleTimer -= deltaTime;
                    if (this.invincibleTimer <= 0) {
                        this.invincible = false;
                    }
                }
                
                if (this.ghostMode) {
                    this.ghostTimer -= deltaTime;
                    if (this.ghostTimer <= 0) {
                        this.ghostMode = false;
                    }
                }
                
                if (this.cursed) {
                    this.cursedTimer -= deltaTime;
                    if (this.cursedTimer <= 0) {
                        this.cursed = false;
                    }
                }
            }

            move(dx, dy, map) {
                if (!this.alive) return;
                
                const newX = this.x + dx * this.speed;
                const newY = this.y + dy * this.speed;
                
                // Collision detection
                if (this.canMoveTo(newX, newY, map)) {
                    this.x = newX;
                    this.y = newY;
                }
            }

            canMoveTo(x, y, map) {
                const tileSize = CONFIG.TILE_SIZE;
                const margin = tileSize * 0.3;
                
                // Check 4 corners of player hitbox
                const corners = [
                    {x: x - margin, y: y - margin},
                    {x: x + margin, y: y - margin},
                    {x: x - margin, y: y + margin},
                    {x: x + margin, y: y + margin}
                ];
                
                for (let corner of corners) {
                    const tileX = Math.floor(corner.x / tileSize);
                    const tileY = Math.floor(corner.y / tileSize);
                    
                    if (tileX < 0 || tileX >= map.length || tileY < 0 || tileY >= map.length) {
                        return false;
                    }
                    
                    const tile = map[tileY][tileX];
                    if (tile === 1 || tile === 2) { // Hard or soft wall
                        if (!this.ghostMode) return false;
                    }
                }
                
                return true;
            }

            placeBomb(game) {
                if (!this.alive) return null;
                if (this.activeBombs >= this.bombCount) return null;
                
                const bombX = Math.floor(this.x / CONFIG.TILE_SIZE);
                const bombY = Math.floor(this.y / CONFIG.TILE_SIZE);
                
                // Check if bomb already exists at position
                const existing = game.bombs.find(b => b.gridX === bombX && b.gridY === bombY);
                if (existing) return null;
                
                const hasRemote = this.powerups.includes('remote');
                const hasFast = this.powerups.includes('fastBomb');
                const timer = hasFast ? 1500 : CONFIG.BOMB_TIMER;
                
                const bomb = new Bomb(
                    bombX * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
                    bombY * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
                    this.fireRange,
                    this,
                    hasRemote,
                    timer
                );
                
                this.activeBombs++;
                return bomb;
            }

            collectPowerup(type) {
                const powerup = POWERUP_TYPES[type];
                if (!powerup) return;
                
                this.score += 20;
                
                switch (powerup.effect) {
                    case 'fireRange':
                        if (this.fireRange < 8) this.fireRange++;
                        break;
                    case 'bombCount':
                        if (this.bombCount < 5) this.bombCount++;
                        break;
                    case 'speed':
                        if (this.speed < 4.5) this.speed += 0.5;
                        break;
                    case 'life':
                        if (this.lives < 3) this.lives++;
                        break;
                    case 'shield':
                        this.shieldActive = true;
                        break;
                    case 'invincible':
                        this.invincible = true;
                        this.invincibleTimer = 8000;
                        break;
                    case 'ghost':
                        this.ghostMode = true;
                        this.ghostTimer = 5000;
                        break;
                    case 'skull':
                        this.cursed = true;
                        this.cursedTimer = 5000;
                        // Random debuff
                        const debuffs = ['slow', 'weak', 'reverse'];
                        const debuff = debuffs[Math.floor(Math.random() * debuffs.length)];
                        if (debuff === 'slow') this.speed = Math.max(1, this.speed - 1);
                        if (debuff === 'weak') this.fireRange = Math.max(1, this.fireRange - 1);
                        break;
                    case 'mystery':
                        // Random powerup
                        const types = Object.keys(POWERUP_TYPES).filter(t => t !== 'MYSTERY' && t !== 'SKULL');
                        const randomType = types[Math.floor(Math.random() * types.length)];
                        this.collectPowerup(randomType);
                        return;
                    default:
                        if (!this.powerups.includes(powerup.effect)) {
                            this.powerups.push(powerup.effect);
                        }
                }
            }

            takeDamage() {
                if (this.invincible) return false;
                
                if (this.shieldActive) {
                    this.shieldActive = false;
                    return false;
                }
                
                this.lives--;
                if (this.lives <= 0) {
                    this.alive = false;
                    this.deaths++;
                    return true;
                }
                
                // Temporary invincibility
                this.invincible = true;
                this.invincibleTimer = 2000;
                return false;
            }

            addKill() {
                this.kills++;
                this.score += 100;
            }
        }

        // ===== BOMB CLASS =====
        class Bomb {
            constructor(x, y, range, owner, remote, timer) {
                this.x = x;
                this.y = y;
                this.gridX = Math.floor(x / CONFIG.TILE_SIZE);
                this.gridY = Math.floor(y / CONFIG.TILE_SIZE);
                this.range = range;
                this.owner = owner;
                this.timer = timer || CONFIG.BOMB_TIMER;
                this.remote = remote;
                this.exploded = false;
                this.fusePhase = 0;
            }

            update(deltaTime) {
                if (this.remote) return; // Don't countdown remote bombs
                
                this.timer -= deltaTime;
                this.fusePhase = Math.floor((CONFIG.BOMB_TIMER - this.timer) / 200) % 2;
                
                if (this.timer <= 0) {
                    return true; // Ready to explode
                }
                return false;
            }

            explode(game) {
                if (this.exploded) return [];
                
                this.exploded = true;
                this.owner.activeBombs--;
                
                const explosions = [];
                const hasPierce = this.owner.powerups.includes('pierce');
                const hasWave = this.owner.powerups.includes('wave');
                const hasPower = this.owner.powerups.includes('powerBomb');
                
                const range = hasPower ? 8 : this.range;
                
                // Center explosion
                explosions.push({x: this.gridX, y: this.gridY});
                
                // Four directions
                const directions = [
                    {dx: 1, dy: 0},
                    {dx: -1, dy: 0},
                    {dx: 0, dy: 1},
                    {dx: 0, dy: -1}
                ];
                
                directions.forEach(dir => {
                    for (let i = 1; i <= range; i++) {
                        const x = this.gridX + dir.dx * i;
                        const y = this.gridY + dir.dy * i;
                        
                        if (x < 0 || x >= game.mapSize || y < 0 || y >= game.mapSize) break;
                        
                        const tile = game.map[y][x];
                        
                        // Hard wall stops explosion
                        if (tile === 1) break;
                        
                        explosions.push({x, y});
                        
                        // Soft wall: destroy and maybe stop
                        if (tile === 2) {
                            game.destroyWall(x, y);
                            if (!hasPierce) break;
                        }
                        
                        // Wave bomb goes through everything
                        if (!hasWave && tile === 2 && !hasPierce) break;
                    }
                });
                
                return explosions;
            }
        }

        // ===== EXPLOSION CLASS =====
        class Explosion {
            constructor(x, y) {
                this.gridX = x;
                this.gridY = y;
                this.x = x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
                this.y = y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
                this.timer = 500;
                this.particles = [];
                
                // Create particles
                for (let i = 0; i < 10; i++) {
                    this.particles.push({
                        x: 0,
                        y: 0,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        life: 1
                    });
                }
            }

            update(deltaTime) {
                this.timer -= deltaTime;
                
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= deltaTime / 500;
                });
                
                return this.timer <= 0;
            }
        }

        // ===== POWERUP CLASS =====
        class PowerUp {
            constructor(type, x, y) {
                this.type = type;
                this.gridX = x;
                this.gridY = y;
                this.x = x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
                this.y = y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
                this.bobOffset = 0;
                this.rotation = 0;
            }

            update(deltaTime) {
                this.bobOffset = Math.sin(Date.now() / 200) * 3;
                this.rotation += deltaTime / 50;
            }
        }

        // ===== GAME CLASS =====
        class Game {
            constructor(mapSize, players) {
                this.mapSize = mapSize;
                this.players = players;
                this.bombs = [];
                this.explosions = [];
                this.powerups = [];
                this.map = null;
                this.gameTime = CONFIG.GAME_TIME;
                this.running = false;
                this.countingDown = true;
                this.countdownValue = 3;
                
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.setupCanvas();
                this.generateMap();
                this.spawnPlayers();
                
                this.keys = {};
                this.setupInput();
                
                this.lastTime = performance.now();
            }

            setupCanvas() {
                const size = this.mapSize * CONFIG.TILE_SIZE;
                this.canvas.width = size;
                this.canvas.height = size;
            }

            generateMap() {
                const generator = new MapGenerator(Date.now());
                this.map = generator.generateMap(this.mapSize);
                this.spawnPositions = generator.getSpawnPositions(this.mapSize);
            }

            spawnPlayers() {
                this.players.forEach((player, index) => {
                    if (index < this.spawnPositions.length) {
                        const spawn = this.spawnPositions[index];
                        player.x = spawn.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
                        player.y = spawn.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
                    }
                });
            }

            setupInput() {
                // Player 1: Arrow Keys + Space
                // Player 2: WASD + Q
                // Player 3: IJKL + U
                // Player 4: TFGH + R
                
                document.addEventListener('keydown', (e) => {
                    // Prevent default for game keys
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'e', 'q', 'u', 'r'].includes(e.key)) {
                        e.preventDefault();
                    }
                    
                    this.keys[e.key.toLowerCase()] = true;
                    
                    // Handle bomb placement
                    if (e.key === ' ' && this.players[0] && this.players[0].alive) {
                        const bomb = this.players[0].placeBomb(this);
                        if (bomb) this.bombs.push(bomb);
                    } else if (e.key.toLowerCase() === 'q' && this.players[1] && this.players[1].alive) {
                        const bomb = this.players[1].placeBomb(this);
                        if (bomb) this.bombs.push(bomb);
                    } else if (e.key.toLowerCase() === 'u' && this.players[2] && this.players[2].alive) {
                        const bomb = this.players[2].placeBomb(this);
                        if (bomb) this.bombs.push(bomb);
                    } else if (e.key.toLowerCase() === 'r' && this.players[3] && this.players[3].alive) {
                        const bomb = this.players[3].placeBomb(this);
                        if (bomb) this.bombs.push(bomb);
                    }
                    
                    // Remote bomb detonation
                    if (e.key.toLowerCase() === 'e') {
                        this.players.forEach(player => {
                            if (player && player.powerups.includes('remote')) {
                                const remoteBomb = this.bombs.find(b => b.owner === player && b.remote);
                                if (remoteBomb) {
                                    const explosions = remoteBomb.explode(this);
                                    this.createExplosions(explosions);
                                    this.bombs = this.bombs.filter(b => b !== remoteBomb);
                                }
                            }
                        });
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });
            }

            handleInput() {
                if (!this.running) return;
                
                // Player 1: Arrow Keys
                if (this.players[0] && this.players[0].alive) {
                    let dx = 0, dy = 0;
                    if (this.keys['arrowleft']) dx -= 1;
                    if (this.keys['arrowright']) dx += 1;
                    if (this.keys['arrowup']) dy -= 1;
                    if (this.keys['arrowdown']) dy += 1;
                    if (dx !== 0 || dy !== 0) {
                        const len = Math.sqrt(dx * dx + dy * dy);
                        this.players[0].move(dx / len, dy / len, this.map);
                    }
                }
                
                // Player 2: WASD
                if (this.players[1] && this.players[1].alive) {
                    let dx = 0, dy = 0;
                    if (this.keys['a']) dx -= 1;
                    if (this.keys['d']) dx += 1;
                    if (this.keys['w']) dy -= 1;
                    if (this.keys['s']) dy += 1;
                    if (dx !== 0 || dy !== 0) {
                        const len = Math.sqrt(dx * dx + dy * dy);
                        this.players[1].move(dx / len, dy / len, this.map);
                    }
                }
                
                // Player 3: IJKL
                if (this.players[2] && this.players[2].alive) {
                    let dx = 0, dy = 0;
                    if (this.keys['j']) dx -= 1;
                    if (this.keys['l']) dx += 1;
                    if (this.keys['i']) dy -= 1;
                    if (this.keys['k']) dy += 1;
                    if (dx !== 0 || dy !== 0) {
                        const len = Math.sqrt(dx * dx + dy * dy);
                        this.players[2].move(dx / len, dy / len, this.map);
                    }
                }
                
                // Player 4: TFGH
                if (this.players[3] && this.players[3].alive) {
                    let dx = 0, dy = 0;
                    if (this.keys['f']) dx -= 1;
                    if (this.keys['h']) dx += 1;
                    if (this.keys['t']) dy -= 1;
                    if (this.keys['g']) dy += 1;
                    if (dx !== 0 || dy !== 0) {
                        const len = Math.sqrt(dx * dx + dy * dy);
                        this.players[3].move(dx / len, dy / len, this.map);
                    }
                }
            }

            update(deltaTime) {
                if (this.countingDown) {
                    return;
                }
                
                if (!this.running) return;
                
                // Update game timer
                this.gameTime -= deltaTime;
                if (this.gameTime <= 0) {
                    this.endGame();
                    return;
                }
                
                // Handle input
                this.handleInput();
                
                // Update players
                this.players.forEach(player => player.update(deltaTime, this.map));
                
                // Update bombs
                for (let i = this.bombs.length - 1; i >= 0; i--) {
                    const bomb = this.bombs[i];
                    if (bomb.update(deltaTime)) {
                        const explosions = bomb.explode(this);
                        this.createExplosions(explosions);
                        this.bombs.splice(i, 1);
                    }
                }
                
                // Update explosions
                for (let i = this.explosions.length - 1; i >= 0; i--) {
                    if (this.explosions[i].update(deltaTime)) {
                        this.explosions.splice(i, 1);
                    }
                }
                
                // Update powerups
                this.powerups.forEach(p => p.update(deltaTime));
                
                // Check collisions
                this.checkCollisions();
                
                // Check win condition
                const alivePlayers = this.players.filter(p => p.alive);
                if (alivePlayers.length <= 1) {
                    this.endGame();
                }
            }

            createExplosions(positions) {
                positions.forEach(pos => {
                    this.explosions.push(new Explosion(pos.x, pos.y));
                    
                    // Chain reaction: detonate other bombs
                    this.bombs.forEach(bomb => {
                        if (bomb.gridX === pos.x && bomb.gridY === pos.y && !bomb.exploded) {
                            setTimeout(() => {
                                if (!bomb.exploded) {
                                    const newExplosions = bomb.explode(this);
                                    this.createExplosions(newExplosions);
                                    this.bombs = this.bombs.filter(b => b !== bomb);
                                }
                            }, 100);
                        }
                    });
                });
            }

            destroyWall(x, y) {
                if (this.map[y][x] === 2) {
                    this.map[y][x] = 0; // Clear soft wall
                    
                    // Spawn powerup
                    if (Math.random() < CONFIG.POWERUP_CHANCE) {
                        this.spawnPowerUp(x, y);
                    }
                    
                    // Award points
                    this.players.forEach(p => {
                        if (p.alive) p.score += 10;
                    });
                }
            }

            spawnPowerUp(x, y) {
                const types = Object.keys(POWERUP_TYPES);
                const type = types[Math.floor(Math.random() * types.length)];
                this.powerups.push(new PowerUp(type, x, y));
            }

            checkCollisions() {
                // Player vs Explosion
                this.explosions.forEach(exp => {
                    this.players.forEach(player => {
                        if (!player.alive) return;
                        
                        if (player.gridX === exp.gridX && player.gridY === exp.gridY) {
                            const died = player.takeDamage();
                            if (died) {
                                // Find who killed them
                                const killerBomb = this.bombs.find(b => 
                                    Math.abs(b.gridX - exp.gridX) <= b.range &&
                                    Math.abs(b.gridY - exp.gridY) <= b.range
                                );
                                if (killerBomb && killerBomb.owner !== player) {
                                    killerBomb.owner.addKill();
                                }
                            }
                        }
                    });
                });
                
                // Player vs PowerUp
                this.powerups = this.powerups.filter(powerup => {
                    for (let player of this.players) {
                        if (!player.alive) continue;
                        
                        if (player.gridX === powerup.gridX && player.gridY === powerup.gridY) {
                            player.collectPowerup(powerup.type);
                            return false;
                        }
                    }
                    return true;
                });
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw map
                this.drawMap();
                
                // Draw powerups
                this.powerups.forEach(p => this.drawPowerUp(p));
                
                // Draw bombs
                this.bombs.forEach(b => this.drawBomb(b));
                
                // Draw explosions
                this.explosions.forEach(e => this.drawExplosion(e));
                
                // Draw players
                this.players.forEach(p => this.drawPlayer(p));
                
                // Draw UI
                this.drawUI();
            }

            drawMap() {
                const ts = CONFIG.TILE_SIZE;
                
                for (let y = 0; y < this.mapSize; y++) {
                    for (let x = 0; x < this.mapSize; x++) {
                        const tile = this.map[y][x];
                        
                        switch (tile) {
                            case 0: // Ground
                                this.ctx.fillStyle = '#90EE90';
                                this.ctx.fillRect(x * ts, y * ts, ts, ts);
                                // Grass texture
                                this.ctx.fillStyle = '#7CCD7C';
                                for (let i = 0; i < 3; i++) {
                                    const gx = x * ts + Math.random() * ts;
                                    const gy = y * ts + Math.random() * ts;
                                    this.ctx.fillRect(gx, gy, 2, 2);
                                }
                                break;
                                
                            case 1: // Hard wall
                                this.ctx.fillStyle = '#555';
                                this.ctx.fillRect(x * ts, y * ts, ts, ts);
                                this.ctx.strokeStyle = '#333';
                                this.ctx.lineWidth = 2;
                                this.ctx.strokeRect(x * ts, y * ts, ts, ts);
                                break;
                                
                            case 2: // Soft wall
                                this.ctx.fillStyle = '#8B4513';
                                this.ctx.fillRect(x * ts, y * ts, ts, ts);
                                // Wood texture
                                this.ctx.fillStyle = '#654321';
                                for (let i = 0; i < 4; i++) {
                                    this.ctx.fillRect(x * ts + i * 8, y * ts, 2, ts);
                                }
                                break;
                                
                            case 3: // Tree
                                this.ctx.fillStyle = '#90EE90';
                                this.ctx.fillRect(x * ts, y * ts, ts, ts);
                                this.ctx.fillStyle = '#228B22';
                                this.ctx.beginPath();
                                this.ctx.arc(x * ts + ts/2, y * ts + ts/2, ts/3, 0, Math.PI * 2);
                                this.ctx.fill();
                                break;
                                
                            case 4: // Bush
                                this.ctx.fillStyle = '#90EE90';
                                this.ctx.fillRect(x * ts, y * ts, ts, ts);
                                this.ctx.fillStyle = '#32CD32';
                                this.ctx.beginPath();
                                this.ctx.arc(x * ts + ts/2, y * ts + ts/2, ts/4, 0, Math.PI * 2);
                                this.ctx.fill();
                                break;
                        }
                        
                        // Grid lines
                        this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                        this.ctx.lineWidth = 1;
                        this.ctx.strokeRect(x * ts, y * ts, ts, ts);
                    }
                }
            }

            drawPlayer(player) {
                if (!player.alive) return;
                
                const ts = CONFIG.TILE_SIZE;
                const size = ts * 0.7;
                
                this.ctx.save();
                
                // Ghost mode transparency
                if (player.ghostMode) {
                    this.ctx.globalAlpha = 0.5;
                }
                
                // Invincibility glow
                if (player.invincible) {
                    const pulse = Math.sin(Date.now() / 100) * 0.5 + 0.5;
                    this.ctx.shadowColor = '#FFD700';
                    this.ctx.shadowBlur = 20 + pulse * 10;
                    
                    // Star particles around player
                    for (let i = 0; i < 8; i++) {
                        const angle = (Date.now() / 500 + i / 8) * Math.PI * 2;
                        const dist = 15 + pulse * 5;
                        const px = player.x + Math.cos(angle) * dist;
                        const py = player.y + Math.sin(angle) * dist;
                        
                        this.ctx.fillStyle = `rgba(255, 215, 0, ${pulse})`;
                        this.ctx.beginPath();
                        this.ctx.arc(px, py, 2, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
                
                // Draw player body (pixel art style)
                const centerX = player.x;
                const centerY = player.y;
                const mainColor = CONFIG.PLAYER_COLORS[player.skin];
                const darkColor = this.darkenColor(mainColor, 0.3);
                const lightColor = this.lightenColor(mainColor, 0.3);
                
                // Body
                this.ctx.fillStyle = mainColor;
                this.ctx.fillRect(centerX - size/2, centerY - size/2, size, size);
                
                // Body shading (3D effect)
                this.ctx.fillStyle = darkColor;
                this.ctx.fillRect(centerX + size/4, centerY - size/2, size/4, size); // Right shadow
                this.ctx.fillRect(centerX - size/2, centerY + size/4, size, size/4); // Bottom shadow
                
                // Body highlight
                this.ctx.fillStyle = lightColor;
                this.ctx.fillRect(centerX - size/2, centerY - size/2, size/4, size/4); // Top-left highlight
                
                // Head (helmet)
                const headSize = size * 0.6;
                this.ctx.fillStyle = mainColor;
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY - size/3, headSize/2, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Helmet visor
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(centerX - headSize/3, centerY - size/3 - 3, headSize * 0.66, 6);
                
                // Visor reflection
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                this.ctx.fillRect(centerX - headSize/3, centerY - size/3 - 2, headSize * 0.4, 2);
                
                // Arms
                const armWave = Math.sin(Date.now() / 200) * 3;
                this.ctx.fillStyle = mainColor;
                // Left arm
                this.ctx.fillRect(centerX - size/2 - 4, centerY - size/4 + armWave, 4, size/2);
                // Right arm  
                this.ctx.fillRect(centerX + size/2, centerY - size/4 - armWave, 4, size/2);
                
                // Legs (walking animation)
                const legOffset = Math.sin(Date.now() / 150) * 2;
                this.ctx.fillStyle = darkColor;
                // Left leg
                this.ctx.fillRect(centerX - size/4, centerY + size/2 - 2, size/3, 6 + legOffset);
                // Right leg
                this.ctx.fillRect(centerX - size/12, centerY + size/2 - 2, size/3, 6 - legOffset);
                
                this.ctx.shadowBlur = 0;
                
                // Shield effect
                if (player.shieldActive) {
                    const shieldPulse = Math.sin(Date.now() / 100) * 0.3 + 0.7;
                    this.ctx.strokeStyle = `rgba(0, 255, 255, ${shieldPulse})`;
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.arc(centerX, centerY, size/2 + 8, 0, Math.PI * 2);
                    this.ctx.stroke();
                    
                    // Shield hexagons
                    for (let i = 0; i < 6; i++) {
                        const angle = (Date.now() / 1000 + i / 6) * Math.PI * 2;
                        const dist = size/2 + 8;
                        const hx = centerX + Math.cos(angle) * dist;
                        const hy = centerY + Math.sin(angle) * dist;
                        
                        this.ctx.fillStyle = `rgba(0, 255, 255, ${shieldPulse * 0.5})`;
                        this.ctx.fillRect(hx - 2, hy - 2, 4, 4);
                    }
                }
                
                // Cursed effect
                if (player.cursed) {
                    const skullSize = 12;
                    this.ctx.fillStyle = 'rgba(128, 0, 128, 0.7)';
                    this.ctx.font = `${skullSize}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    
                    const floatY = Math.sin(Date.now() / 200) * 5;
                    this.ctx.fillText('💀', centerX, centerY - size/2 - 15 + floatY);
                }
                
                // Name tag with better styling
                this.ctx.shadowBlur = 0;
                this.ctx.font = 'bold 11px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                
                const nameY = centerY - size/2 - 28;
                
                // Name background
                const nameWidth = this.ctx.measureText(player.name).width;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                this.ctx.fillRect(centerX - nameWidth/2 - 4, nameY - 7, nameWidth + 8, 14);
                
                // Name text
                this.ctx.strokeStyle = '#000';
                this.ctx.lineWidth = 3;
                this.ctx.strokeText(player.name, centerX, nameY);
                this.ctx.fillStyle = '#FFF';
                this.ctx.fillText(player.name, centerX, nameY);
                
                // Health bar with better design
                const barWidth = ts * 0.8;
                const barHeight = 5;
                const barX = centerX - barWidth / 2;
                const barY = centerY - size/2 - 38;
                
                // Bar background
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                this.ctx.fillRect(barX - 1, barY - 1, barWidth + 2, barHeight + 2);
                
                // Bar background (empty)
                this.ctx.fillStyle = '#333';
                this.ctx.fillRect(barX, barY, barWidth, barHeight);
                
                // Bar fill (gradient)
                const healthPercent = player.lives / 3;
                const gradient = this.ctx.createLinearGradient(barX, barY, barX + barWidth * healthPercent, barY);
                if (healthPercent > 0.5) {
                    gradient.addColorStop(0, '#00FF00');
                    gradient.addColorStop(1, '#88FF00');
                } else if (healthPercent > 0.25) {
                    gradient.addColorStop(0, '#FFAA00');
                    gradient.addColorStop(1, '#FF8800');
                } else {
                    gradient.addColorStop(0, '#FF0000');
                    gradient.addColorStop(1, '#AA0000');
                }
                
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(barX, barY, barWidth * healthPercent, barHeight);
                
                // Bar shine
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                this.ctx.fillRect(barX, barY, barWidth * healthPercent, 2);
                
                this.ctx.restore();
            }
            
            darkenColor(color, amount) {
                const hex = color.replace('#', '');
                const r = Math.max(0, parseInt(hex.substr(0, 2), 16) * (1 - amount));
                const g = Math.max(0, parseInt(hex.substr(2, 2), 16) * (1 - amount));
                const b = Math.max(0, parseInt(hex.substr(4, 2), 16) * (1 - amount));
                return `rgb(${r}, ${g}, ${b})`;
            }
            
            lightenColor(color, amount) {
                const hex = color.replace('#', '');
                const r = Math.min(255, parseInt(hex.substr(0, 2), 16) * (1 + amount));
                const g = Math.min(255, parseInt(hex.substr(2, 2), 16) * (1 + amount));
                const b = Math.min(255, parseInt(hex.substr(4, 2), 16) * (1 + amount));
                return `rgb(${r}, ${g}, ${b})`;
            }

            drawBomb(bomb) {
                const ts = CONFIG.TILE_SIZE;
                const x = bomb.x;
                const y = bomb.y;
                const size = ts * 0.5;
                
                this.ctx.save();
                
                // Pulsing animation based on timer
                const timePercent = bomb.timer / CONFIG.BOMB_TIMER;
                const pulseScale = 1 + (1 - timePercent) * 0.1;
                const actualSize = size * pulseScale;
                
                // Shadow
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                this.ctx.beginPath();
                this.ctx.ellipse(x, y + actualSize * 0.8, actualSize * 0.8, actualSize * 0.3, 0, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Bomb body (sphere with shading)
                const gradient = this.ctx.createRadialGradient(
                    x - actualSize * 0.3, y - actualSize * 0.3, 0,
                    x, y, actualSize
                );
                gradient.addColorStop(0, '#333');
                gradient.addColorStop(0.5, '#000');
                gradient.addColorStop(1, '#111');
                
                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(x, y, actualSize, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Highlight (shiny effect)
                const highlightGradient = this.ctx.createRadialGradient(
                    x - actualSize * 0.35, y - actualSize * 0.35, 0,
                    x - actualSize * 0.35, y - actualSize * 0.35, actualSize * 0.4
                );
                highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                this.ctx.fillStyle = highlightGradient;
                this.ctx.beginPath();
                this.ctx.arc(x - actualSize * 0.35, y - actualSize * 0.35, actualSize * 0.4, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Fuse
                const fuseLength = actualSize * 0.6;
                const fuseAngle = -Math.PI / 2 + Math.sin(Date.now() / 100) * 0.2;
                const fuseX = x + Math.cos(fuseAngle) * fuseLength;
                const fuseY = y + Math.sin(fuseAngle) * fuseLength;
                
                // Fuse rope
                this.ctx.strokeStyle = '#654321';
                this.ctx.lineWidth = 4;
                this.ctx.lineCap = 'round';
                this.ctx.beginPath();
                this.ctx.moveTo(x, y - actualSize);
                this.ctx.quadraticCurveTo(
                    x + Math.sin(Date.now() / 200) * 5, 
                    y - actualSize - 5,
                    fuseX, 
                    fuseY
                );
                this.ctx.stroke();
                
                // Burning fuse effect
                if (timePercent < 0.5 || bomb.fusePhase === 1) {
                    const sparkSize = 3 + Math.random() * 3;
                    
                    // Spark glow
                    this.ctx.shadowColor = '#FF6600';
                    this.ctx.shadowBlur = 15;
                    
                    // Spark core
                    const sparkGradient = this.ctx.createRadialGradient(fuseX, fuseY, 0, fuseX, fuseY, sparkSize);
                    sparkGradient.addColorStop(0, '#FFFF00');
                    sparkGradient.addColorStop(0.3, '#FF6600');
                    sparkGradient.addColorStop(1, '#FF0000');
                    
                    this.ctx.fillStyle = sparkGradient;
                    this.ctx.beginPath();
                    this.ctx.arc(fuseX, fuseY, sparkSize, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Spark particles
                    for (let i = 0; i < 3; i++) {
                        const particleAngle = Math.random() * Math.PI * 2;
                        const particleDist = Math.random() * 8;
                        const px = fuseX + Math.cos(particleAngle) * particleDist;
                        const py = fuseY + Math.sin(particleAngle) * particleDist;
                        
                        this.ctx.fillStyle = `rgba(255, ${100 + Math.random() * 155}, 0, ${Math.random()})`;
                        this.ctx.beginPath();
                        this.ctx.arc(px, py, 1 + Math.random() * 2, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
                
                this.ctx.shadowBlur = 0;
                
                // Timer text (countdown)
                if (!bomb.remote) {
                    const timeLeft = Math.ceil(bomb.timer / 1000);
                    
                    // Timer background
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 10, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Timer text
                    this.ctx.fillStyle = timeLeft <= 1 ? '#FF0000' : '#FFFFFF';
                    this.ctx.font = 'bold 14px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(timeLeft, x, y);
                } else {
                    // Remote bomb indicator
                    this.ctx.fillStyle = '#00FFFF';
                    this.ctx.font = 'bold 16px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText('R', x, y);
                }
                
                // Danger warning when about to explode
                if (timePercent < 0.3) {
                    const warningAlpha = Math.sin(Date.now() / 100) * 0.3 + 0.4;
                    this.ctx.strokeStyle = `rgba(255, 0, 0, ${warningAlpha})`;
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, actualSize + 5, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
                
                this.ctx.restore();
            }

            drawExplosion(exp) {
                const ts = CONFIG.TILE_SIZE;
                const x = exp.x;
                const y = exp.y;
                const alpha = exp.timer / 500;
                const scale = 1 - (exp.timer / 500) * 0.3;
                
                this.ctx.save();
                
                // Shockwave ring
                const ringRadius = (1 - alpha) * ts * 1.5;
                const ringGradient = this.ctx.createRadialGradient(x, y, ringRadius - 5, x, y, ringRadius);
                ringGradient.addColorStop(0, `rgba(255, 255, 200, ${alpha * 0.5})`);
                ringGradient.addColorStop(1, `rgba(255, 100, 0, 0)`);
                
                this.ctx.fillStyle = ringGradient;
                this.ctx.beginPath();
                this.ctx.arc(x, y, ringRadius, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Main explosion fireball
                const fireGradient = this.ctx.createRadialGradient(x, y, 0, x, y, ts * 0.6 * scale);
                fireGradient.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                fireGradient.addColorStop(0.2, `rgba(255, 255, 100, ${alpha})`);
                fireGradient.addColorStop(0.5, `rgba(255, 150, 0, ${alpha * 0.8})`);
                fireGradient.addColorStop(0.8, `rgba(255, 50, 0, ${alpha * 0.5})`);
                fireGradient.addColorStop(1, `rgba(100, 0, 0, 0)`);
                
                this.ctx.fillStyle = fireGradient;
                this.ctx.beginPath();
                this.ctx.arc(x, y, ts * 0.6 * scale, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Fire particles with trails
                exp.particles.forEach(p => {
                    if (p.life <= 0) return;
                    
                    const px = x + p.x;
                    const py = y + p.y;
                    const particleSize = 4 * p.life * scale;
                    
                    // Particle glow
                    this.ctx.shadowColor = p.life > 0.5 ? '#FFFF00' : '#FF6600';
                    this.ctx.shadowBlur = 10 * p.life;
                    
                    // Particle gradient
                    const pGradient = this.ctx.createRadialGradient(px, py, 0, px, py, particleSize);
                    if (p.life > 0.7) {
                        pGradient.addColorStop(0, `rgba(255, 255, 255, ${p.life})`);
                        pGradient.addColorStop(0.5, `rgba(255, 255, 100, ${p.life})`);
                        pGradient.addColorStop(1, `rgba(255, 150, 0, 0)`);
                    } else if (p.life > 0.4) {
                        pGradient.addColorStop(0, `rgba(255, 255, 100, ${p.life})`);
                        pGradient.addColorStop(0.5, `rgba(255, 100, 0, ${p.life})`);
                        pGradient.addColorStop(1, `rgba(255, 0, 0, 0)`);
                    } else {
                        pGradient.addColorStop(0, `rgba(255, 100, 0, ${p.life})`);
                        pGradient.addColorStop(0.5, `rgba(150, 0, 0, ${p.life})`);
                        pGradient.addColorStop(1, `rgba(50, 0, 0, 0)`);
                    }
                    
                    this.ctx.fillStyle = pGradient;
                    this.ctx.beginPath();
                    this.ctx.arc(px, py, particleSize, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Particle trail
                    this.ctx.strokeStyle = `rgba(255, ${50 + p.life * 155}, 0, ${p.life * 0.3})`;
                    this.ctx.lineWidth = 2 * p.life;
                    this.ctx.beginPath();
                    this.ctx.moveTo(px, py);
                    this.ctx.lineTo(px - p.vx * 2, py - p.vy * 2);
                    this.ctx.stroke();
                });
                
                this.ctx.shadowBlur = 0;
                
                // Cross-shaped fire rays
                const rayLength = ts * 0.4 * alpha;
                const rayWidth = ts * 0.3 * alpha;
                
                // Horizontal ray
                const hGradient = this.ctx.createLinearGradient(x - rayLength, y, x + rayLength, y);
                hGradient.addColorStop(0, 'rgba(255, 100, 0, 0)');
                hGradient.addColorStop(0.5, `rgba(255, 200, 0, ${alpha})`);
                hGradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
                this.ctx.fillStyle = hGradient;
                this.ctx.fillRect(x - rayLength, y - rayWidth/2, rayLength * 2, rayWidth);
                
                // Vertical ray
                const vGradient = this.ctx.createLinearGradient(x, y - rayLength, x, y + rayLength);
                vGradient.addColorStop(0, 'rgba(255, 100, 0, 0)');
                vGradient.addColorStop(0.5, `rgba(255, 200, 0, ${alpha})`);
                vGradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
                this.ctx.fillStyle = vGradient;
                this.ctx.fillRect(x - rayWidth/2, y - rayLength, rayWidth, rayLength * 2);
                
                // Smoke puffs at the end
                if (alpha < 0.5) {
                    const smokeAlpha = (0.5 - alpha) * 2;
                    const smokeSize = ts * 0.5 * (1 - smokeAlpha);
                    
                    this.ctx.fillStyle = `rgba(50, 50, 50, ${smokeAlpha * 0.5})`;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y - 5, smokeSize, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                
                this.ctx.restore();
            }

            drawPowerUp(powerup) {
                const ts = CONFIG.TILE_SIZE;
                const x = powerup.x;
                const y = powerup.y + powerup.bobOffset;
                const boxSize = ts * 0.7;
                
                this.ctx.save();
                
                // Glow pulse effect
                const glowPulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
                this.ctx.shadowColor = '#FFD700';
                this.ctx.shadowBlur = 15 * glowPulse;
                
                // Sparkle particles around powerup
                for (let i = 0; i < 6; i++) {
                    const angle = (Date.now() / 1000 + i / 6) * Math.PI * 2;
                    const dist = 15 + Math.sin(Date.now() / 300) * 3;
                    const sparkX = x + Math.cos(angle) * dist;
                    const sparkY = y + Math.sin(angle) * dist;
                    const sparkSize = 2 + Math.sin(Date.now() / 200 + i) * 1;
                    
                    this.ctx.fillStyle = `rgba(255, 255, 200, ${glowPulse})`;
                    this.ctx.beginPath();
                    this.ctx.arc(sparkX, sparkY, sparkSize, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                
                // 3D Box base
                this.ctx.shadowBlur = 0;
                
                // Box shadow
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                this.ctx.fillRect(x - boxSize/2 + 3, y - boxSize/2 + 3, boxSize, boxSize);
                
                // Box back face (dark)
                this.ctx.fillStyle = '#B8860B';
                this.ctx.fillRect(x - boxSize/2 + 4, y - boxSize/2 + 4, boxSize, boxSize);
                
                // Box main face (gradient)
                const boxGradient = this.ctx.createLinearGradient(
                    x - boxSize/2, y - boxSize/2,
                    x + boxSize/2, y + boxSize/2
                );
                boxGradient.addColorStop(0, '#FFE87C');
                boxGradient.addColorStop(0.5, '#FFD700');
                boxGradient.addColorStop(1, '#FFA500');
                
                this.ctx.fillStyle = boxGradient;
                this.ctx.fillRect(x - boxSize/2, y - boxSize/2, boxSize, boxSize);
                
                // Box edges (3D effect)
                this.ctx.strokeStyle = '#B8860B';
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(x - boxSize/2, y - boxSize/2, boxSize, boxSize);
                
                // Box highlight
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                this.ctx.fillRect(x - boxSize/2, y - boxSize/2, boxSize, boxSize * 0.3);
                
                // Box inner border
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                this.ctx.lineWidth = 1;
                this.ctx.strokeRect(x - boxSize/2 + 2, y - boxSize/2 + 2, boxSize - 4, boxSize - 4);
                
                // Question mark pattern for mystery
                if (powerup.type === 'MYSTERY') {
                    const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'];
                    const colorIndex = Math.floor(Date.now() / 200) % colors.length;
                    this.ctx.fillStyle = colors[colorIndex];
                    this.ctx.font = 'bold 24px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText('?', x, y);
                } else {
                    // Draw powerup icon/emoji
                    this.ctx.font = `${boxSize * 0.6}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    
                    // Icon shadow
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    this.ctx.fillText(POWERUP_TYPES[powerup.type].emoji, x + 1, y + 1);
                    
                    // Icon
                    this.ctx.fillStyle = '#000';
                    this.ctx.fillText(POWERUP_TYPES[powerup.type].emoji, x, y);
                }
                
                // Rotating outline
                const rotationAngle = (Date.now() / 1000) * 2;
                this.ctx.strokeStyle = `rgba(255, 215, 0, ${glowPulse})`;
                this.ctx.lineWidth = 2;
                this.ctx.setLineDash([5, 5]);
                this.ctx.lineDashOffset = -Date.now() / 50;
                
                this.ctx.save();
                this.ctx.translate(x, y);
                this.ctx.rotate(rotationAngle);
                this.ctx.strokeRect(-boxSize/2 - 3, -boxSize/2 - 3, boxSize + 6, boxSize + 6);
                this.ctx.restore();
                
                this.ctx.setLineDash([]);
                
                // Powerup name label (on hover effect - always show)
                const name = POWERUP_TYPES[powerup.type].name;
                this.ctx.font = '9px Arial';
                this.ctx.textAlign = 'center';
                
                const labelY = y + boxSize/2 + 12;
                const labelWidth = this.ctx.measureText(name).width + 6;
                
                // Label background
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                this.ctx.fillRect(x - labelWidth/2, labelY - 8, labelWidth, 12);
                
                // Label text
                this.ctx.fillStyle = '#FFD700';
                this.ctx.fillText(name, x, labelY - 2);
                
                this.ctx.restore();
            }

            drawUI() {
                const hudDiv = document.getElementById('gameUI');
                hudDiv.innerHTML = '';
                
                this.players.forEach(player => {
                    const hud = document.createElement('div');
                    hud.className = 'player-hud';
                    hud.style.opacity = player.alive ? '1' : '0.5';
                    
                    hud.innerHTML = `
                        <div class="avatar">${CONFIG.PLAYER_EMOJIS[player.skin]}</div>
                        <div class="player-stats">
                            <div style="font-weight: bold;">${player.name}</div>
                            <div class="stat-bar">
                                ❤️ ${player.lives} | 💣 ${player.bombCount} | 🔥 ${player.fireRange} | ⭐ ${player.score}
                            </div>
                        </div>
                    `;
                    
                    hudDiv.appendChild(hud);
                });
                
                // Timer
                const minutes = Math.floor(this.gameTime / 60000);
                const seconds = Math.floor((this.gameTime % 60000) / 1000);
                const timerDiv = document.createElement('div');
                timerDiv.style.fontSize = '24px';
                timerDiv.style.fontWeight = 'bold';
                timerDiv.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                hudDiv.appendChild(timerDiv);
                
                // Active powerups indicator
                const mainPlayer = this.players[0];
                if (mainPlayer && mainPlayer.alive) {
                    const powerupDiv = document.getElementById('powerupIndicator');
                    powerupDiv.innerHTML = '';
                    
                    mainPlayer.powerups.forEach(effectName => {
                        const powerup = Object.values(POWERUP_TYPES).find(p => p.effect === effectName);
                        if (powerup) {
                            const icon = document.createElement('div');
                            icon.className = 'powerup-icon';
                            icon.textContent = powerup.emoji;
                            icon.title = powerup.name;
                            powerupDiv.appendChild(icon);
                        }
                    });
                }
            }

            startCountdown() {
                const showCountdown = (num) => {
                    const countdown = document.createElement('div');
                    countdown.className = 'countdown';
                    countdown.textContent = num === 0 ? 'GO!' : num;
                    document.getElementById('gameContainer').appendChild(countdown);
                    
                    setTimeout(() => countdown.remove(), 1000);
                };
                
                showCountdown(3);
                setTimeout(() => showCountdown(2), 1000);
                setTimeout(() => showCountdown(1), 2000);
                setTimeout(() => {
                    showCountdown(0);
                    this.countingDown = false;
                    this.running = true;
                }, 3000);
            }

            endGame() {
                this.running = false;
                
                // Award survival bonus
                this.players.forEach(player => {
                    if (player.alive) {
                        player.score += 300;
                    }
                });
                
                // Sort by score
                const rankings = [...this.players].sort((a, b) => b.score - a.score);
                
                // Show game over screen
                showScreen('gameOver');
                
                const leaderboard = document.getElementById('leaderboard');
                leaderboard.innerHTML = '<h2>🏆 Bảng Xếp Hạng 🏆</h2>';
                
                rankings.forEach((player, index) => {
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item' + (index === 0 ? ' winner' : '');
                    item.innerHTML = `
                        <span>${index + 1}. ${CONFIG.PLAYER_EMOJIS[player.skin]} ${player.name}</span>
                        <span>Score: ${player.score} | Kills: ${player.kills} | Deaths: ${player.deaths}</span>
