                    `;
                    leaderboard.appendChild(item);
                });
                
                // Save to localStorage
                this.saveLeaderboard(rankings);
            }

            saveLeaderboard(rankings) {
                const saved = JSON.parse(localStorage.getItem('bombermanScores') || '[]');
                
                rankings.forEach(player => {
                    saved.push({
                        name: player.name,
                        score: player.score,
                        kills: player.kills,
                        deaths: player.deaths,
                        date: new Date().toISOString()
                    });
                });
                
                // Keep top 50
                saved.sort((a, b) => b.score - a.score);
                saved.splice(50);
                
                localStorage.setItem('bombermanScores', JSON.stringify(saved));
            }

            gameLoop() {
                const currentTime = performance.now();
                const deltaTime = currentTime - this.lastTime;
                this.lastTime = currentTime;
                
                this.update(deltaTime);
                this.render();
                
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // ===== UI FUNCTIONS =====
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            currentScreen = screenId;
        }

        function joinGame() {
            // Get player config
            playerConfig.name = document.getElementById('playerName').value.trim() || 'Player';
            playerConfig.mapSize = parseInt(document.getElementById('mapSize').value);
            
            if (playerConfig.name.length === 0) {
                playerConfig.name = 'Player';
            }
            
            // Generate unique ID
            myPlayerId = Date.now() + Math.random();
            
            // Join shared room
            const room = getRoom();
            
            // Check if room is full
            if (room.players.length >= 4) {
                alert('Phòng đã đầy! (4/4 người chơi)');
                return;
            }
            
            // Add self to room
            room.players.push({
                id: myPlayerId,
                name: playerConfig.name,
                skin: playerConfig.skin,
                timestamp: Date.now()
            });
            
            saveRoom(room);
            
            // Show lobby
            showScreen('lobby');
            updateLobby();
            
            // Start checking for updates
            startLobbyCheck();
        }

        function getRoom() {
            try {
                const roomData = localStorage.getItem(SHARED_ROOM_KEY);
                if (roomData) {
                    const room = JSON.parse(roomData);
                    // Clean up old players (timeout after 30 seconds)
                    const now = Date.now();
                    room.players = room.players.filter(p => now - p.timestamp < 30000);
                    return room;
                }
            } catch (e) {
                console.error('Error loading room:', e);
            }
            
            return {
                players: [],
                mapSize: playerConfig.mapSize,
                gameStarted: false
            };
        }

        function saveRoom(room) {
            try {
                localStorage.setItem(SHARED_ROOM_KEY, JSON.stringify(room));
            } catch (e) {
                console.error('Error saving room:', e);
            }
        }

        function startLobbyCheck() {
            // Update room presence
            lobbyCheckInterval = setInterval(() => {
                if (currentScreen !== 'lobby') {
                    stopLobbyCheck();
                    return;
                }
                
                const room = getRoom();
                
                // Update my timestamp
                const me = room.players.find(p => p.id === myPlayerId);
                if (me) {
                    me.timestamp = Date.now();
                    saveRoom(room);
                }
                
                updateLobby();
                
                // Auto-start if triggered
                if (room.gameStarted && currentScreen === 'lobby') {
                    actuallyStartGame();
                }
            }, 1000);
        }

        function stopLobbyCheck() {
            if (lobbyCheckInterval) {
                clearInterval(lobbyCheckInterval);
                lobbyCheckInterval = null;
            }
        }

        function updateLobby() {
            const room = getRoom();
            const list = document.getElementById('playerList');
            list.innerHTML = '<h3>Người chơi trong phòng:</h3>';
            
            room.players.forEach((player, index) => {
                const item = document.createElement('div');
                item.className = 'player-item';
                item.style.animation = 'fadeIn 0.3s ease-in';
                item.innerHTML = `
                    <div class="player-avatar">${CONFIG.PLAYER_EMOJIS[player.skin]}</div>
                    <div style="flex: 1;">
                        <div style="font-weight: bold;">${player.name}</div>
                        <div style="font-size: 12px; color: #aaa;">Player ${index + 1}</div>
                    </div>
                    ${player.id === myPlayerId ? '<div style="color: #00ff00;">👤 You</div>' : ''}
                `;
                list.appendChild(item);
            });
            
            // Update start button
            const startBtn = document.getElementById('startBtn');
            if (room.players.length >= 2 && room.players.length <= 4) {
                startBtn.disabled = false;
                startBtn.textContent = `Bắt Đầu (${room.players.length}/4 người chơi)`;
            } else if (room.players.length === 1) {
                startBtn.disabled = true;
                startBtn.textContent = 'Đang chờ thêm người chơi...';
            }
        }

        function startGame() {
            const room = getRoom();
            
            if (room.players.length < 2) {
                alert('Cần ít nhất 2 người chơi!');
                return;
            }
            
            // Mark game as started
            room.gameStarted = true;
            saveRoom(room);
            
            // Start game immediately
            actuallyStartGame();
        }

        function actuallyStartGame() {
            stopLobbyCheck();
            
            const room = getRoom();
            
            // Create players from room
            const players = room.players.map((p, index) => {
                const player = new Player(p.id, p.name, p.skin, 0, 0);
                return player;
            });
            
            // Start game
            showScreen('gameContainer');
            gameInstance = new Game(room.mapSize, players);
            gameInstance.startCountdown();
            gameInstance.gameLoop();
        }

        function playAgain() {
            // Clear room
            const room = {
                players: [],
                mapSize: playerConfig.mapSize,
                gameStarted: false
            };
            saveRoom(room);
            
            gameInstance = null;
            backToMenu();
        }

        function backToMenu() {
            stopLobbyCheck();
            
            // Remove self from room
            if (myPlayerId) {
                const room = getRoom();
                room.players = room.players.filter(p => p.id !== myPlayerId);
                room.gameStarted = false;
                saveRoom(room);
            }
            
            gameInstance = null;
            myPlayerId = null;
            showScreen('menu');
        }

        // ===== SKIN SELECTOR =====
        document.querySelectorAll('.skin-option').forEach((option, index) => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.skin-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                playerConfig.skin = index;
            });
        });

        // ===== INITIALIZE =====
        window.addEventListener('load', () => {
            console.log('🎮 Bomberman Online loaded!');
            console.log('Controls:');
            console.log('Player 1: Arrow Keys + Space');
            console.log('Player 2: WASD + Q');
            console.log('Player 3: IJKL + U');
            console.log('Player 4: TFGH + R');
        });
    </script>
</body>
</html>
